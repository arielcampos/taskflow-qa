<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TaskFlow QA v1.1</title>
<script src="vendor/jszip.min.js"></script>
<script src="vendor/jspdf.umd.min.js"></script>
<script src="parser.js"></script>
<script src="i18n.js"></script>
<style>
:root{
  --bg:#f2f6f6; --side:#e7eded; --panel:#ffffff; --panel2:#f5f8f8; --input:#ffffff;
  --line:#d3dddd; --edge:#8fa5ab; --text:#13222a; --muted:#5a6c72; --accent:#11956a; --accent-ink:#ffffff;
  --accent-soft:rgba(17,149,106,.12); --pend:#b96d0a; --pend-soft:rgba(185,109,10,.14); --danger:#c23b3b;
  --p-work:#7350d1; --p-verif:#f2c744; --p-verif-ink:#2a2000; --p-evid:#d24343; --p-esc:#d2428a;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#13222b; --side:#0e1a21; --panel:#172a33; --panel2:#1b313b; --input:#12232b;
    --line:#26414c; --edge:#6f939d; --text:#e5eef0; --muted:#8ca4ab; --accent:#2fd08f; --accent-ink:#05261a;
    --accent-soft:rgba(47,208,143,.14); --pend:#f0a43a; --pend-soft:rgba(240,164,58,.16); --danger:#ef6b6b;
    --p-work:#8a6af0; --p-verif:#f2c744; --p-verif-ink:#2a2000; --p-evid:#d64a4a; --p-esc:#d84a93;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#13222b; --side:#0e1a21; --panel:#172a33; --panel2:#1b313b; --input:#12232b;
  --line:#26414c; --edge:#6f939d; --text:#e5eef0; --muted:#8ca4ab; --accent:#2fd08f; --accent-ink:#05261a;
  --accent-soft:rgba(47,208,143,.14); --pend:#f0a43a; --pend-soft:rgba(240,164,58,.16); --danger:#ef6b6b;
  --p-work:#8a6af0; --p-verif:#f2c744; --p-verif-ink:#2a2000; --p-evid:#d64a4a; --p-esc:#d84a93;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:14px;line-height:1.5}
button,select,input,textarea{font:inherit;color:inherit;box-sizing:border-box}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sr{position:absolute;left:-9999px}
[hidden]{display:none!important}
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}

/* Sidebar */
.side{background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:16px 12px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;align-items:center;gap:8px;padding:4px 6px 16px}
.logo{width:28px;height:28px;border-radius:7px;background:var(--accent);display:grid;place-items:center;color:var(--accent-ink)}
.brand b{font-size:17px;letter-spacing:-.01em}
.badge{font-size:10px;font-weight:700;background:var(--accent-soft);color:var(--accent);padding:2px 6px;border-radius:5px}
.grp{font-size:10.5px;font-weight:600;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin:12px 8px 6px}
.langswitch{display:flex;gap:4px;margin:0 8px 10px}
.langswitch button{flex:1;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:5px 0;font-size:12px;font-weight:700;cursor:pointer}
.langswitch button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.create{display:flex;align-items:center;gap:8px;width:100%;padding:8px 10px;border-radius:8px;background:var(--panel);border:1px solid var(--line);cursor:pointer;font-weight:500}
.create:hover{border-color:var(--accent)}
.tasksel{width:100%;padding:8px 10px;border-radius:8px;background:var(--panel);border:1px solid var(--line);font-size:13px}
.nav{list-style:none;margin:14px 0 0;padding:0;display:flex;flex-direction:column;gap:2px}
.nav a,.foot button{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border:0;border-radius:8px;background:transparent;cursor:pointer;text-align:left;color:var(--muted);font-weight:500;text-decoration:none}
.nav a:hover,.foot button:hover{background:var(--panel2);color:var(--text)}
.nav a[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.nav svg,.foot svg{width:16px;height:16px;flex:none}
.foot{margin-top:auto;padding-top:14px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:2px}
#moreSettings{display:flex;flex-direction:column;gap:2px}
#moreSettings[hidden]{display:none !important}
#settingsBtn[aria-expanded="true"]{background:var(--accent-soft);color:var(--accent)}
.handoff-edit{width:100%;min-height:90px;margin-top:8px}
.foot button{font-size:13px;padding:7px 10px}
.switch{margin-left:auto;width:30px;height:17px;border-radius:9px;background:var(--line);position:relative;flex:none}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:13px;height:13px;border-radius:50%;background:var(--panel);transition:left .15s}
[aria-pressed="true"] .switch{background:var(--accent)}
[aria-pressed="true"] .switch::after{left:15px}
.me{display:flex;align-items:center;gap:10px;padding:10px;margin-top:6px;border-radius:8px;background:var(--panel)}
.av{width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:11px;font-weight:700;flex:none}
.me small{display:block;color:var(--muted);font-size:11px;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.foot button.me{background:var(--panel);color:var(--text);margin-top:6px;cursor:pointer}
.ver{font-size:10px;font-weight:700;color:var(--muted);letter-spacing:.02em}

.topbar{display:none}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .topbar{display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:20;background:var(--side);border-bottom:1px solid var(--line);padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top,0px));margin-top:calc(-1 * env(safe-area-inset-top,0px))}
  .side{position:fixed;inset:0 auto 0 0;width:270px;z-index:40;transform:translateX(-100%);transition:transform .2s;padding-top:calc(16px + env(safe-area-inset-top,0px))}
  .side.open{transform:none}
  .scrim.open{display:block}
}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:35;display:none}

/* Main */
main{padding:16px 8px 48px clamp(12px,1.5vw,20px);width:100%;min-width:0}
.eyebrow{font-size:11px;font-weight:600;color:var(--accent);letter-spacing:.06em;text-transform:uppercase}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin:4px 0 12px}
.head-stats{display:flex;gap:8px;align-items:stretch;flex-wrap:wrap;justify-content:flex-end}
.head-stat{display:flex;flex-direction:column;align-items:center;justify-content:space-between;text-align:center;width:6.7rem;min-height:4.6rem;background:var(--accent-soft);border:1px solid var(--accent);border-radius:10px;padding:8px 6px 8px}
.head-stat span{display:flex;align-items:center;justify-content:center;min-height:2.5em;font-size:11px;color:var(--muted);font-weight:600;line-height:1.25}
.head-stat b{display:block;font-size:18px;line-height:1;margin-top:6px;font-variant-numeric:tabular-nums;color:var(--text)}
.head-stat.is-done b{color:var(--accent)}
h1{margin:0;font-size:26px;letter-spacing:-.02em;line-height:1.2}
h2{font-size:16px;margin:0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{color:var(--text);display:inline-flex;align-items:center;gap:7px;padding:7px 13px;border-radius:8px;border:1px solid var(--line);background:var(--panel);cursor:pointer;font-weight:600;font-size:13px;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.sm{padding:4px 10px;font-size:12px}
.btn.danger{color:var(--danger)}
.btn:disabled{opacity:.5;cursor:default}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:14px}
.muted{color:var(--muted)}
.tag{font-size:11px;font-weight:700;padding:2px 8px;border-radius:5px;background:var(--accent-soft);color:var(--accent)}
.status{display:inline-block;font-size:11px;font-weight:700;padding:2px 9px;border-radius:999px;background:var(--pend-soft);color:var(--pend)}
.status.done{background:var(--accent-soft);color:var(--accent)}
.status.progress{background:color-mix(in srgb,var(--p-work) 18%,transparent);color:var(--p-work)}
.taskhead h2{font-size:18px;margin:8px 0 4px}
.meta{display:flex;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:12.5px}
.progress{height:6px;border-radius:3px;background:var(--panel2);overflow:hidden;margin-top:12px}
.progress i{display:block;height:100%;background:var(--accent);transition:width .3s}
.overview{border-left:3px solid var(--accent)}
.escalate{border-left:3px solid var(--danger)}
.hours-box{border-left:3px solid var(--pend)}
.hours-box input{margin-top:8px}
.files-box{border-left:3px solid var(--p-work)}
.escalate ul{margin:8px 0 0;padding-left:18px}
.escalate li{margin:4px 0}
.stats{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;margin-bottom:22px}
.impl-layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(240px,min(300px,26%));gap:14px;align-items:start;width:100%}
.impl-main{min-width:0}
.impl-side{position:sticky;top:8px;width:100%;max-height:calc(100vh - 16px);overflow-y:auto;padding-right:0}
.impl-side .panel,.impl-side .stat{width:100%}
.impl-side .stats{grid-template-columns:1fr;gap:8px;margin-bottom:0}
.impl-side .stat{padding:10px 12px}
.impl-side .panel:last-child{margin-bottom:0}
@media (max-width:1080px){.impl-layout{grid-template-columns:1fr}.impl-side{position:static;max-height:none}}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;gap:12px;align-items:center}
.stat .ic{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);flex:none}
.stat b{display:block;font-size:20px;line-height:1.1}
.stat.is-done b{color:var(--accent)}
.stat span{font-size:12px;color:var(--muted)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:0 0 12px;overflow-x:auto}
.taskhead{margin-bottom:8px}
.tabs button{border:0;background:transparent;padding:8px 12px;cursor:pointer;color:var(--muted);font-weight:600;font-size:13px;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--text);border-bottom-color:var(--accent)}
.notice{border:1px solid var(--pend);background:var(--pend-soft);border-radius:10px;padding:12px 14px;margin-bottom:14px}
.notice ul{margin:6px 0 0;padding-left:18px}

/* Cards */
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:12px}
.card.is-done{border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
.ctop{display:flex;gap:12px;align-items:flex-start}
.check{width:22px;height:22px;border-radius:50%;border:2px solid var(--muted);background:transparent;cursor:pointer;flex:none;display:grid;place-items:center;margin-top:2px;padding:0}
.check[aria-checked="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.check svg{width:12px;height:12px;opacity:0}
.check[aria-checked="true"] svg{opacity:1}
.cbody{flex:1;min-width:0}
.cbody h3{margin:0;font-size:15px}
.is-done .cbody h3{text-decoration:line-through;text-decoration-color:var(--muted)}
.path{font-size:12px;color:var(--muted);margin-top:2px}
.cbody p{margin:6px 0 0;max-width:75ch}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:2px 9px;border-radius:999px}
.p-work{background:var(--p-work);color:#fff}
.p-verif{background:var(--p-verif);color:var(--p-verif-ink)}
.p-evid{background:var(--p-evid);color:#fff}
.p-esc{background:var(--p-esc);color:#fff}
.p-build{background:var(--accent);color:var(--accent-ink);cursor:help}
.ctitle{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.ctitle h3{min-width:0}
.csent{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.csent p{margin:6px 0 0;flex:1;min-width:0}
.csent .pill{margin-top:6px;flex:none}
#tip.wide{max-width:min(520px,calc(100vw - 24px));white-space:pre-wrap}
.pills{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap}
.block{margin-top:12px;padding-left:34px}
.block ul{margin:6px 0 0;padding-left:18px}
.block li{margin:3px 0;max-width:75ch}
.counts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px;max-width:420px}
.counts label{font-size:12px;color:var(--muted)}
input[type=text],input[type=number],textarea,select.field{width:100%;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--input)}
textarea{resize:vertical;min-height:70px}
.plan{list-style:none;padding:0;margin:10px 0 0;display:flex;flex-direction:column;gap:12px}
.plan>li{display:flex;gap:10px;align-items:flex-start}
.snum{width:22px;height:22px;border-radius:6px;background:var(--panel2);border:1px solid var(--line);font-size:11.5px;font-weight:700;color:var(--muted);display:grid;place-items:center;flex:none}
.sbody{flex:1;min-width:0}
.subs{display:flex;flex-direction:column;gap:6px;margin:7px 0 0 28px}
.whole{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.ctabs{display:inline-flex;gap:4px;margin:12px 0 0 34px;padding:3px;border:1px solid var(--line);border-radius:999px;background:var(--panel2)}
.ctab{border:0;background:transparent;border-radius:999px;padding:3px 11px;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer}
.ctab[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.ctab .cnt{font-size:10.5px;opacity:.8}
table.build{min-width:0}
table.build th{width:22%;min-width:110px;background:var(--panel2);font-size:12px}
.term{border-bottom:1.5px dotted var(--accent);cursor:help;border-radius:2px}
.term:hover,.term:focus-visible{background:var(--accent-soft)}
.step.done .term{border-bottom-color:var(--muted)}
#tip{position:fixed;z-index:80;max-width:min(340px,calc(100vw - 24px));background:var(--text);color:var(--bg);padding:8px 11px;border-radius:8px;font-size:12.5px;line-height:1.45;pointer-events:none;opacity:0;transition:opacity .12s;box-shadow:0 6px 20px rgba(0,0,0,.25)}
#tip.show{opacity:1}
#tip b{display:block;margin-bottom:2px}
.excerpt{margin:0}
.verbatim{margin:10px 0 0;max-height:none}
.excerpt+.excerpt{margin-top:10px}
.pill.sm{font-size:10px;padding:1px 7px;flex:none;margin-top:1px}
.step{display:flex;gap:8px;align-items:flex-start;max-width:95ch}
.check.sm{width:18px;height:18px;margin-top:1px;border-width:2px}
.check.sm svg{width:10px;height:10px}
.stxt{min-width:0}
.step.done .stxt{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--muted)}
.step.partial .stxt{color:var(--pend)}
.step.failed .stxt{color:var(--danger)}
.tradios{display:inline-flex;gap:8px;flex-wrap:wrap;align-items:center}
.tradio{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;color:var(--muted);white-space:nowrap}
.tradio input{margin:0}
.evacts{display:flex;gap:6px;flex-wrap:wrap;width:100%;margin-top:6px}
.step{flex-wrap:wrap}
.link.sm{font-size:11.5px;white-space:nowrap;margin-top:1px}
.coll{margin-top:10px;padding-left:34px;display:flex;flex-direction:column;gap:6px}
.coll details{border:1px solid var(--line);border-radius:8px;background:var(--panel2)}
.coll summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;padding:7px 10px;font-size:13px;font-weight:600}
.coll summary::-webkit-details-marker{display:none}
.it{font-size:9.5px;font-weight:700;width:20px;height:20px;border-radius:5px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);flex:none}
.coll summary .chev{margin-left:auto;color:var(--muted);transition:transform .15s}
.coll details[open] .chev{transform:rotate(90deg)}
.coll .inner{padding:0 10px 10px}
.recs{display:flex;flex-direction:column;gap:8px}
.rec{display:grid;grid-template-columns:minmax(23ch,26ch) minmax(0,1fr) auto;gap:8px;align-items:end}
.rec label{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:4px;min-width:0}
.rec input{min-width:0}
.rec .rid{font-variant-numeric:tabular-nums;letter-spacing:.02em}
.rec .rid.warn{border-color:var(--danger)}
.rec.rec-text{grid-template-columns:minmax(0,1fr) auto;align-items:start}
.rec.rec-text textarea{min-height:64px}
.rec-actions{display:flex;gap:8px;flex-wrap:wrap}
.rec .iconbtn{margin-bottom:5px}
.recwarn{font-size:11.5px;color:var(--danger);grid-column:1/-1;margin-top:-4px}
@media (max-width:560px){.rec{grid-template-columns:minmax(0,1fr) auto}.rec label:nth-child(2){grid-column:1/2}}
.coll .count{font-size:11px;color:var(--muted);font-weight:500}
.shots{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.shot{position:relative;width:110px}
.shot img{width:110px;height:72px;object-fit:cover;border-radius:6px;border:1px solid var(--line);display:block;background:var(--panel)}
.shot small{display:block;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.shot button{position:absolute;top:3px;right:3px;border:0;border-radius:50%;width:20px;height:20px;background:rgba(0,0,0,.6);color:#fff;cursor:pointer;line-height:1;padding:0}
.iconbtn{border:0;background:transparent;color:var(--muted);cursor:pointer;padding:4px;border-radius:6px}
.iconbtn:hover{color:var(--danger);background:var(--panel2)}

/* Context / handoff */
.ctx ul,.handoff ul{margin:8px 0 0;padding-left:18px}
.ctx li,.handoff li{margin:4px 0;max-width:78ch}
.ctx h3{font-size:13px;margin:14px 0 0;color:var(--muted)}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:8px;margin-top:10px}
table{border-collapse:collapse;width:100%;min-width:420px;font-size:13px}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{background:var(--panel2);color:var(--muted);font-weight:600}
tr:last-child td{border-bottom:0}
td.n{font-variant-numeric:tabular-nums}
.ok{color:var(--accent);font-weight:600}
.bad{color:var(--danger);font-weight:600}
code.file{background:var(--panel2);border:1px solid var(--line);border-radius:5px;padding:1px 6px;font-size:12.5px}
.empty{text-align:center;padding:60px 20px}
.empty p{max-width:46ch;margin:8px auto 18px}
.diagram{overflow-x:auto}
.diagram svg{display:block;min-width:640px}
.diagram svg rect,.diagram svg line{stroke:var(--edge);stroke-width:1.5}
.tasklist .task{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.tasklist .task .grow{flex:1;min-width:200px}

/* Modal */
#srcDlg{width:min(900px,calc(100vw - 24px))}
.srctext{font-family:inherit;white-space:pre-wrap;word-break:break-word;font-size:13.5px;line-height:1.65;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:14px 16px;max-height:62vh;overflow:auto;margin:0}
.srctext mark{background:color-mix(in srgb,var(--p-verif) 42%,transparent);color:inherit;border-radius:3px;padding:0 1px}
.link{background:none;border:0;padding:0;color:var(--accent);cursor:pointer;font-size:12.5px;font-weight:600;text-decoration:underline;text-underline-offset:2px}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--panel);color:var(--text);padding:0;width:min(680px,calc(100vw - 24px));max-height:calc(100vh - 40px)}
dialog::backdrop{background:rgba(0,0,0,.5)}
.mhead{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.mbody{padding:16px 18px;display:flex;flex-direction:column;gap:12px;overflow-y:auto;max-height:calc(100vh - 190px)}

<script>
/* ---------- Constants ---------- */
const ICON_CHECK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L19 7"/></svg>';
const NO_CHANGES='Nothing changed outside the requirements.';
const VIEWS=['implementation','context','impact','questions','evidence','handoff','tasks'];
const PARSE_RULES=`You turn one Zoho CRM development task (plain text) into a structured Implementation & Testing workspace. Do not add features that the task does not ask for.

Parsing rules:
- overview: what the work is, in plain language, 1 to 3 sentences, no field-level detail (no criteria, columns, sort or API names).
- Each view or deliverable becomes ONE work item (kind "work"). title = the view or deliverable name exactly. module = the Zoho CRM module it lives in. sentence = one short sentence describing it, with NO criteria, columns, sort or API names. existing = true only if the task says the view already exists and only needs verifying or adjusting. fields = the Zoho field names the view uses in its criteria, columns or sort, exactly as the task names them (display names); an empty list if the task names none. Fields are shown only in the impact diagram, never in the sentence. source = every passage of the task text that relates to this item, copied VERBATIM character for character (no rewording, no ellipsis, no added words), each passage as its own string, whole lines where possible: its name, module, criteria, columns, sort, sharing, counts, evidence, record IDs, and for break cases the break case and escalation lines. Together the passages must cover everything in the task that is linked to this item.
- steps: the plan for the item, as small checkable steps. Use ONLY what the task states explicitly. Never invent steps, values, tests or evidence the task does not state, and never add generic best-practice steps.
  - Each step is one explicit build instruction, for example create the view, set a criterion the task names, add the columns it names, set the sort it names, set sharing to the target it names. One step per explicit instruction. text = a short imperative that keeps the task's exact names and values. source = the verbatim passage it comes from, copied character for character.
  - Under each step, "tests" = the explicit checks the task requires for that step (for example check sharing is set to the named target), and "evidence" = the explicit evidence the task requires for that step (for example a screenshot of that setting). Each has text and a verbatim source. Empty lists if the task requires none for that step.
- build: "What you're building" for this item: every detail the task states about the deliverable itself, one row per detail, for example Module, View name, Criteria, Columns, Sort, Sharing, Count, or the task's own label. label = short label; text = the detail with the task's exact names and values; source = the verbatim passage it comes from. Only what the task states.
- checks: explicit tests and evidence the task requires for the item as a whole rather than for one step, for example comparing the view count to the module filter count, posting the record count, a screenshot of the edit page, record IDs to post. type "verification" for tests, "evidence" for evidence; text and verbatim source as above.
- Each Break Case becomes its own item (kind "break"), titled with the break case as the task states it, with "escalation" = when to escalate, taken from the task. Its steps and checks follow the same explicit-only rule.
- Reviewers go into reviewers.
- Prerequisites, definitions and what the work touches are context only: background (definitions), prerequisites, impact. Never turn them into fake work items.
- problem, words, beforeStart, touches: the task's own "The problem", "Words used here", "Before you start" and "What it touches" sections, copied VERBATIM with their line breaks (empty string if the task has no such section).
- escalateIf: ONLY the escalation conditions: each point that describes a situation to escalate, copied verbatim including its instruction, for example "The existing view is locked by another user. Tell the reviewer." One string per point. Do NOT include how to escalate, hand-off or handoff-comment instructions, reviewers, intros, or any other text from that section.
- acceptance: each Done When / acceptance point copied verbatim, one string per point.
- doneWhen: the same criteria rewritten as already completed, using phrasing like "have been created", "has been applied", "have been posted", "have been met". Never "the views exist". End with "All acceptance criteria have been met."
- missing: questions ONLY when a module, view name, count or sharing target is missing or ambiguous. Otherwise an empty list.
- number: the task number such as "1.1". title: the task title without the number.

Return ONLY a JSON object with exactly these keys:
{"number":"","title":"","overview":"","items":[{"kind":"work","title":"","module":"","sentence":"","existing":false,"fields":[""],"source":[""],"build":[{"label":"","text":"","source":""}],"steps":[{"text":"","source":"","tests":[{"text":"","source":""}],"evidence":[{"text":"","source":""}]}],"checks":[{"type":"verification","text":"","source":""}],"escalation":""}],"problem":"","words":"","beforeStart":"","touches":"","background":[""],"prerequisites":[""],"impact":[""],"acceptance":[""],"escalateIf":[""],"reviewers":[""],"doneWhen":[""],"missing":[""]}

The task:
`;

/* ---------- State ---------- */
const S={tasks:{},currentId:null,view:'implementation',tab:'all',ready:false,cardView:{},evOpen:{},lang:lsGet('tf.lang')==='es'?'es':'en'};
let db=null,uid=null,sample=null,downloads=null,col=null;
const writeQ={};
const shotCache={};

/* ---------- Helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function isBi(v){return !!(v&&typeof v==='object'&&!Array.isArray(v)&&(Object.prototype.hasOwnProperty.call(v,'en')||Object.prototype.hasOwnProperty.call(v,'es')));}
function loc(v){
  if(v==null)return '';
  if(isBi(v)){const lang=S.lang==='es'?'es':'en',alt=lang==='es'?'en':'es';const a=v[lang],b=v[alt];return String((a!=null&&String(a).trim())?a:(b!=null?b:'')).trim();}
  return String(v);
}
function keepText(v){if(v==null)return '';if(isBi(v))return {en:String(v.en||''),es:String(v.es||'')};return String(v).trim();}
function keepSections(v){
  if(!v||typeof v!=='object'||Array.isArray(v))return null;
  const out={};
  ['did','evidence','done','changes','questions','time'].forEach(k=>{if(v[k]!=null)out[k]=String(v[k]);});
  return Object.keys(out).length?out:null;
}
function keepList(v){if(!Array.isArray(v))return [];return v.map(keepText).filter(x=>loc(x).trim());}
function pointKey(v){return isBi(v)?String(v.en||v.es||''):String(v||'');}
const uidGen=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
const arr=v=>Array.isArray(v)?v.map(x=>String(x??'').trim()).filter(Boolean):[];
let toastT;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2600);}
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v);return true}catch(e){return false}}
const cur=()=>S.tasks[S.currentId]||null;
const fileBase=t=>(t.number||'task').replace(/[^\w.-]+/g,'_');

function normalizeTask(p){
  const t={
    id:p.id||uidGen(), number:String(p.number||'').trim(), title:keepText(p.title)||'Untitled task',
    overview:keepText(p.overview), rawText:String(p.rawText||''), status:p.status||'Pending', hours:String(p.hours??''), handoffEdit:p.handoffEdit==null?null:String(p.handoffEdit), handoffSections:keepSections(p.handoffSections),
    background:arr(p.background), prerequisites:arr(p.prerequisites), impact:arr(p.impact),
    acceptance:keepList(p.acceptance), escalateIf:keepList(p.escalateIf), reviewers:arr(p.reviewers),
    doneWhen:keepList(p.doneWhen), missing:keepList(p.missing), problem:keepText(p.problem), words:keepText(p.words), beforeStart:keepText(p.beforeStart), touches:keepText(p.touches), doneChecks:(p.doneChecks&&typeof p.doneChecks==='object'&&!Array.isArray(p.doneChecks))?p.doneChecks:{}, createdAt:p.createdAt||Date.now(), updatedAt:p.updatedAt||Date.now(),
    items:(Array.isArray(p.items)?p.items:[]).map(normalizeItem)
  };
  return t;
}
function normBuilding(v){
  if(!v)return null;
  if(typeof v==='string'){const text=v.trim();if(!text||text==='[object Object]')return null;return {label:"What you’re building",text};}
  if(typeof v==='object'){const label=String(v.label||'').trim(),text=String(v.text||'').trim();if(!label&&!text)return null;return {label,text};}
  return null;
}
function normalizeItem(i){
  const out={id:i.id||uidGen(), kind:i.kind==='break'?'break':'work', title:keepText(i.title)||'Untitled', module:String(i.module||'').trim(),
    sentence:keepText(i.sentence), whatYouBuilding:normBuilding(i.whatYouBuilding), existing:!!i.existing, ...normPlan(i),
    escalation:keepText(i.escalation), fields:arr(i.fields), source:arr(i.source), build:(Array.isArray(i.build)?i.build:[]).filter(b=>b&&(loc(b.text)||loc(b.label))).map(b=>({label:keepText(b.label),text:keepText(b.text),source:String(b.source||'').trim()})), done:!!i.done, filterCount:String(i.filterCount??''), viewCount:String(i.viewCount??''),
    records:normRecords(i), questions:String(i.questions||''), changes:String(i.changes||''),
    shots:Array.isArray(i.shots)?i.shots.filter(s=>s&&s.id):[]};
  syncDone(out);return out;
}

/* ---------- Storage ---------- */
let saveTimer=null, storagePath='';
function showStore(note){
  const el=$('#storeNote');if(!el)return;
  el.textContent=note;el.title=note;
}
function workspacePayload(){return {currentId:S.currentId,tasks:JSON.parse(JSON.stringify(S.tasks))};}
async function initStore(){
  if(window.taskflow){
    try{
      const info=await window.taskflow.getInfo();
      storagePath=info.path||'';
      showStore(storagePath||'Local file');
      const data=await window.taskflow.load();
      S.tasks={};
      const raw=data&&data.tasks||{};
      const list=Array.isArray(raw)?raw:Object.values(raw);
      list.forEach(v=>{if(v&&v.id)S.tasks[v.id]=normalizeTask(v);});
      S.currentId=(data&&data.currentId&&S.tasks[data.currentId])?data.currentId:pickCurrent();
      S.ready=true;render();
    }catch(e){showStore('Saving unavailable');S.ready=true;render();toast('Couldn’t open the workspace file.');}
    return;
  }
  const C=window.claude;
  const guard=p=>Promise.race([p,new Promise(r=>setTimeout(()=>r(null),10000))]);
  if(C&&C.use){
    try{
      const [u,d,s,dl]=await Promise.all([guard(C.use('user')),guard(C.use('db')),guard(C.use('sample')),guard(C.use('downloads'))]);
      sample=s;downloads=dl;
      if(u&&d){uid=await u.id(); if(uid){db=d;col='data/users/'+uid;}}
    }catch(e){}
  }
  if(db){
    showStore('Saved to your account');
    const timer=setTimeout(()=>{if(!S.ready){S.ready=true;render();toast('Your tasks can’t be reached yet. Showing what’s available.')}},10000);
    db.collection(col).onSnapshot(snap=>{
      clearTimeout(timer);
      const next={};
      snap.docs.forEach(d=>{const v=d.data();if(v&&v.id){try{next[v.id]=normalizeTask(JSON.parse(JSON.stringify(v)));}catch(e){}}});
      for(const id in S.tasks){const q=writeQ[id];if(q&&(q.timer||q.busy))next[id]=S.tasks[id];}
      const changed=JSON.stringify(next)!==JSON.stringify(S.tasks);
      S.tasks=next;S.ready=true;
      if(!S.tasks[S.currentId])S.currentId=pickCurrent();
      if(changed||!S.renderedOnce)safeRender();
    },err=>{clearTimeout(timer);S.ready=true;showStore('Saving unavailable');toast('Your saved tasks couldn’t be loaded: '+err.code);render();});
  }else{
    showStore('Saved in this browser');
    try{const raw=JSON.parse(lsGet('tf.tasks')||'{}')||{};S.tasks={};Object.values(raw).forEach(v=>{if(v&&v.id)S.tasks[v.id]=normalizeTask(v);});}catch(e){S.tasks={}}
    S.currentId=pickCurrent();S.ready=true;render();
  }
}
function pickCurrent(){
  const saved=lsGet('tf.current');
  if(saved&&S.tasks[saved])return saved;
  const list=Object.values(S.tasks).sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0));
  return list[0]?list[0].id:null;
}
function persist(task,delay=600){
  if(task&&task.id){task.updatedAt=Date.now();S.tasks[task.id]=task;}
  if(window.taskflow){clearTimeout(saveTimer);saveTimer=setTimeout(()=>flushAll(),delay);return;}
  if(!db){if(!lsSet('tf.tasks',JSON.stringify(S.tasks)))toast('Browser storage is full; export a backup.');return;}
  const q=writeQ[task.id]||(writeQ[task.id]={timer:null,busy:false,again:false});
  clearTimeout(q.timer);q.timer=setTimeout(()=>{q.timer=null;flush(task.id)},delay);
}
async function flushAll(){
  if(!window.taskflow)return;
  try{await window.taskflow.save(workspacePayload());}
  catch(e){toast('Couldn’t save the workspace file.');}
}
async function flush(id){
  const q=writeQ[id];if(q.busy){q.again=true;return;}
  const t=S.tasks[id];if(!t)return;
  q.busy=true;
  try{await db.collection(col).doc(id).set(JSON.parse(JSON.stringify(t)));}
  catch(e){toast(e.code==='invalid_argument'?'You can view this workspace but not change it.':'Couldn’t save: '+(e.code||'error'));}
  q.busy=false;
  if(q.again){q.again=false;flush(id);}
}
async function removeTask(id){

function compress(file){
  return new Promise((res,rej)=>{
    const img=new Image();const url=URL.createObjectURL(file);
    img.onload=()=>{
      let max=1600,q=.82,out='';
      for(let i=0;i<8;i++){
        const sc=Math.min(1,max/Math.max(img.width,img.height));
        const c=document.createElement('canvas');c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);
        const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.drawImage(img,0,0,c.width,c.height);
        out=c.toDataURL('image/jpeg',q);
        if(out.length<235000)break;
        q=Math.max(.5,q-.08);max=Math.round(max*.85);
      }
      URL.revokeObjectURL(url);res(out);
    };
    img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('Not an image'))};
    img.src=url;
  });
}

/* ---------- Sections of the original text ---------- */
const HEAD_ALIASES={'the problem':'problem','problem':'problem','words used here':'words','before you start':'before','what it touches':'touches',
  'done when':'done','escalate if':'escalate','break case':'break','break cases':'break','what we\'re building':'building','what you\'re building':'building',
  'what we’re building':'building','what you’re building':'building','what is being built':'building','steps':'steps','evidence':'evidence','required evidence':'evidence',
  'testing':'testing','testing required':'testing','reviewers':'reviewers','notes':'notes','acceptance criteria':'done','handoff':'handoff','hand-off':'handoff','hand off':'handoff','handoff comment':'handoff','hand-off comment':'handoff','what to post':'handoff','how to escalate':'notes'};
const HEAD_KEYS=Object.keys(HEAD_ALIASES).sort((a,b)=>b.length-a.length);
function headingOf(line){
  const l=line.trim().replace(/^#+\s*/,'').replace(/^\*\*|\*\*$/g,'').replace(/^\*\*/,'');
  for(const k of HEAD_KEYS){
    const re=new RegExp('^'+k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'(?![a-z])\\s*(?:\\*\\*)?\\s*[:：.]?\\s*(?:\\*\\*)?\\s*(.*)$','i');
    const m=l.match(re);if(m&&(!m[1]||/[:：]/.test(l.slice(k.length,k.length+4))))return {key:HEAD_ALIASES[k],rest:m[1].trim()};
  }
  return null;
}
function sections(raw){
  const out={};if(!raw)return out;let cur=null,buf=[];
  const flush=()=>{if(cur){const txt=buf.join('\n').replace(/^\s*\n|\n\s*$/g,'');if(txt.trim())out[cur]=(out[cur]?out[cur]+'\n':'')+txt;}};
  raw.split('\n').forEach(l=>{const h=headingOf(l);if(h||/^#+\s/.test(l.trim())){flush();cur=h?h.key:null;buf=h&&h.rest?[h.rest]:[];}else if(cur)buf.push(l);});
  flush();return out;
}
const pointsOf=txt=>String(txt||'').split('\n').map(l=>l.replace(/^\s*(?:[-*•–]|\d+[.)]|\[[ xX]?\])\s*/,'').trim()).filter(Boolean);
function sec(t,key,fallback){const v=sections(String(t.rawText||''))[key];return v&&v.trim()?{text:v,fromRaw:true}:{text:loc(fallback||''),fromRaw:false};}
function donePoints(t){const s=sections(t.rawText).done;return s?pointsOf(s):t.acceptance;}
const ESC_NOISE=/\b(hand[\s-]?off|reviewers?|post (it|this|them|the)|in the (task )?comment|how to escalate)\b/i;
const BULLET=/^\s*(?:[-*•–]|\d+[.)])\s+/;
function escalatePoints(t){
  const fromParser=(t.escalateIf||[]).map(loc).filter(x=>x&&!ESC_NOISE.test(x));
  if(fromParser.length)return fromParser;
  const sx=sections(t.rawText).escalate;if(!sx)return [];
  const out=[];let started=false;
  for(const l of sx.split('\n')){
    const txt=l.replace(BULLET,'').trim();if(!txt)continue;
    if(BULLET.test(l)){started=true;if(!ESC_NOISE.test(txt))out.push(txt);}
    else if(started)break;
    else if(!ESC_NOISE.test(txt)&&!/[:：]$/.test(txt))out.push(txt);
  }

}
const doneUnits=t=>donePoints(t).map(x=>({id:'dw:'+pointKey(x),text:loc(x),key:pointKey(x),source:loc(x),done:!!t.doneChecks[pointKey(x)]}));

/* ---------- Glossary tooltips ---------- */
let GL=null;
function glossary(t){
  const src=(sections(String(t.rawText||'')).words)||loc(t.words)||(t.background||[]).join('\n');
  const map=new Map();let last=null;
  String(src||'').split('\n').forEach(line=>{
    const l=line.replace(/^\s*(?:[-*•–]|\d+[.)])\s*/,'').trim();if(!l)return;
    const m=l.match(/^(.{1,60}?)\s*(?::|—|–|\s-\s|=)\s+(.+)$/);
    if(m){const term=m[1].replace(/^[\s*"“'‘_]+|[\s*"”'’_]+$/g,'').trim();
      if(term&&term.split(/\s+/).length<=6){last=term;map.set(term.toLowerCase(),{term,def:m[2].trim()});return;}}
    if(last){const e=map.get(last.toLowerCase());e.def+=' '+l;}
  });
  if(!map.size)return null;
  const terms=[...map.values()].map(e=>e.term).sort((a,b)=>b.length-a.length);
  const re=new RegExp('(?<![\\p{L}\\p{N}_])('+terms.map(x=>x.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|')+')(?![\\p{L}\\p{N}_])','giu');
  return {map,re};
}
function gl(text){
  text=String(text??'');
  if(!GL||!text)return esc(text);
  let out='',p=0;GL.re.lastIndex=0;let m;
  while((m=GL.re.exec(text))){
    const e=GL.map.get(m[0].toLowerCase());
    out+=esc(text.slice(p,m.index))+(e?`<span class="term" tabindex="0" data-tip-term="${esc(e.term)}" data-tip="${esc(e.def)}" aria-description="${esc(e.term)}: ${esc(e.def)}">${esc(m[0])}</span>`:esc(m[0]));
    p=m.index+m[0].length;
  }
  return out+esc(text.slice(p));
}

function taskWorked(t){
  if(!t)return false;

  if(t.handoffEdit!=null)return true;
  if(t.handoffSections&&Object.keys(t.handoffSections).length)return true;
  if(t.doneChecks&&Object.values(t.doneChecks).some(Boolean))return true;
  return (t.items||[]).some(i=>{
    if(i.done)return true;
    if(String(i.questions||'').trim()||String(i.changes||'').trim())return true;
    if(String(i.filterCount??'')!==''||String(i.viewCount??'')!=='')return true;
    if((i.shots||[]).length||recs(i).length)return true;

}

const okText=x=>x&&loc(x.text).trim();

  const out={id:x.id||uidGen(),type,text:keepText(x.text),source:String(x.source||'').trim(),done:!!x.done};
  if(type==='evidence'){out.records=normRecords(x);out.shots=Array.isArray(x.shots)?x.shots.filter(s=>s&&s.id):[];}

function normPlan(i){
  const steps=[],checks=[],d=!!i.done;
  (Array.isArray(i.steps)?i.steps:[]).filter(okText).forEach(x=>{
    if(x.type==='verification'||x.type==='evidence'){checks.push(normCheck(x));return;}
    const c=[...(Array.isArray(x.checks)?x.checks.filter(okText).map(y=>normCheck(y)):[]),
             ...(Array.isArray(x.tests)?x.tests.filter(okText).map(y=>normCheck(y,'verification')):[]),
             ...(Array.isArray(x.evidence)?x.evidence.filter(okText).map(y=>normCheck(y,'evidence')):[])];
    steps.push({id:x.id||uidGen(),text:keepText(x.text),source:String(x.source||'').trim(),done:!!x.done,checks:c});
  });
  if(Array.isArray(i.checks))i.checks.filter(okText).forEach(y=>checks.push(normCheck(y)));
  if(!Array.isArray(i.steps)&&!Array.isArray(i.checks)){

function head(title,actions=''){return `<div class="eyebrow">${esc(tr('eyebrow'))}</div><div class="head"><h1>${esc(title)}</h1><div class="row">${actions}</div></div>`;}
function taskHeader(t,st){

function fileRefs(t){
  const blobs=[t.rawText,loc(t.overview),loc(t.problem),loc(t.beforeStart),loc(t.touches),loc(t.words)];
  (t.items||[]).forEach(i=>{
    blobs.push(loc(i.sentence),i.whatYouBuilding&&loc(i.whatYouBuilding.text),...(i.source||[]));
    (i.build||[]).forEach(b=>blobs.push(loc(b.text),b.source));
    units(i).forEach(u=>blobs.push(loc(u.text),u.source));
  });
  const text=blobs.filter(Boolean).join('\n');
  const out=[],seen=new Set();
  const add=(label,href,kind)=>{const key=String(href).toLowerCase();if(!href||seen.has(key))return;seen.add(key);out.push({label:label||href,href,kind});};
  let m;
  const md=/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g;
  while((m=md.exec(text)))add(m[1],m[2].replace(/[.,;]+$/,''),'link');
  const urls=/https?:\/\/[^\s<>)\]]+/g;
  while((m=urls.exec(text))){const href=m[0].replace(/[.,;]+$/,'');add(href,href,'link');}
  const paths=/(?:[A-Za-z]:\\|\\\\)[^\r\n\t<>"]+/g;
  while((m=paths.exec(text))){const href=m[0].replace(/[),.;]+$/,'');if(href.length>3)add(href,href,'path');}
  return out;
}

}

  +(S.tab==='done'

    :(items.length?items.map(i=>card(t,i)).join(''):(S.tab==='break'&&escalatePoints(t).length?'':`<div class="panel muted">${esc(tr('nothing'))}</div>`))

const checkPill=c=>c.type==='evidence'?[tr('pill.evidence'),'p-evid']:[tr('pill.test'),'p-verif'];
const ordered=cs=>[...cs.filter(c=>c.type==='evidence'),...cs.filter(c=>c.type!=='evidence')];
function stepGroups(i,brk){
  let out='';

    out+=`<div class="block"><ol class="plan" style="margin-top:4px">${i.steps.map((x,k)=>`<li><div class="snum">${k+1}</div><div class="sbody">${unitRow(x,[tr('pill.task'),'p-work'])}${x.checks.length?`<div class="subs">${ordered(x.checks).map(c=>unitRow(c,checkPill(c))).join('')}</div>`:''}</div></li>`).join('')}</ol></div>`;
  }else{
    out+=`<div class="block muted" style="font-size:13px">No explicit steps in the task for this item. Add them with the pencil if needed.</div>`;
  }
  const counts=!brk&&needsCounts(i)?`<div class="counts"><label>Filter count<input type="text" inputmode="numeric" data-field="filterCount" value="${esc(i.filterCount)}"></label><label>View count<input type="text" inputmode="numeric" data-field="viewCount" value="${esc(i.viewCount)}"></label></div>`:'';
  if(i.checks.length||counts){
    out+=`<div class="block"><div class="whole">Required for the whole item</div>${i.checks.length?`<div class="subs" style="margin-left:0">${ordered(i.checks).map(c=>unitRow(c,checkPill(c))).join('')}</div>`:''}${counts}</div>`;
  }
  return out;
}

function verbatimBlock(t,key,title,fallbackText,fallbackList,editKey){

function viewImpact(t){
  const mods=[...new Set(t.items.map(i=>i.module||'No module'))];
  const W=780,x1=20,mw=250,x2=360,vw=380,rowH=56,boxH=40,fRow=19,gap=26;
  const cut=(s,n)=>s.length>n?s.slice(0,n-1)+'…':s;
  let y=16,lines='',boxes='';
  const box=(x,cy,w,label,sub,fill,ink)=>`<g><rect x="${x}" y="${cy-20}" width="${w}" height="${boxH}" rx="8" fill="${fill}" stroke="var(--edge)" stroke-width="1.5"/><text x="${x+12}" y="${cy-2}" font-size="13" font-weight="600" fill="${ink}">${esc(cut(label,Math.floor(w/8)))}</text><text x="${x+12}" y="${cy+13}" font-size="11" fill="var(--muted)">${esc(sub)}</text></g>`;
  mods.forEach(m=>{
    const its=t.items.filter(i=>(i.module||'No module')===m);
    const fields=[...new Set(its.flatMap(i=>i.fields||[]))];
    const tblH=fields.length?8+fRow*(fields.length+1):0;
    const gh=Math.max(boxH+tblH,its.length*rowH-(rowH-boxH));
    const my=y+20;
    boxes+=box(x1,my,mw,m,'Zoho CRM module','var(--panel2)','var(--text)');
    if(fields.length){
      const ty=y+boxH+8;
      boxes+=`<g><rect x="${x1}" y="${ty}" width="${mw}" height="${fRow*(fields.length+1)}" rx="6" fill="var(--panel)" stroke="var(--edge)" stroke-width="1.5"/><text x="${x1+10}" y="${ty+13}" font-size="10" font-weight="600" fill="var(--muted)">Field</text>`;
      fields.forEach((f,k)=>{const ry=ty+fRow*(k+1);boxes+=`<line x1="${x1}" y1="${ry}" x2="${x1+mw}" y2="${ry}" stroke="var(--edge)" stroke-width="1.5"/><text x="${x1+10}" y="${ry+13}" font-size="10.5" fill="var(--text)">${esc(cut(f,40))}</text>`;});
      boxes+='</g>';
    }
    its.forEach((i,k)=>{
      const iy=y+20+k*rowH;
      lines+=`<path d="M${x1+mw} ${my} C ${x1+mw+50} ${my}, ${x2-50} ${iy}, ${x2} ${iy}"${i.kind==='break'?' stroke="var(--p-esc)" stroke-dasharray="4 4"':''}/>`;
      boxes+=box(x2,iy,vw,loc(i.title),i.kind==='break'?'Escalation trigger':(i.existing?'Existing view: verify':'New custom view'),'var(--panel)',i.done?'var(--accent)':'var(--text)');
    });
    y+=gh+gap;
  });
  const H=y-gap+16;
  const s=`<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Modules, their fields, and the views this task touches"><g fill="none" stroke="var(--edge)" stroke-width="1.75" stroke-linecap="round">${lines}</g>${boxes}</svg>`;

  +verbatimBlock(t,'touches','What it touches',t.touches,t.impact,'touches');
}

/* ---------- Tooltip behaviour ---------- */
const tip=$('#tip');let tipFor=null;
const tipEl=e=>e.target.closest&&e.target.closest('.term, .wyb');
function showTip(el){
  tipFor=el;tip.classList.toggle('wide',el.classList.contains('wyb'));tip.innerHTML=`<b>${esc(el.dataset.tipTerm)}</b>${esc(el.dataset.tip)}`;tip.classList.add('show');
  const r=el.getBoundingClientRect(),tw=tip.offsetWidth,th=tip.offsetHeight;
  let x=Math.min(Math.max(8,r.left+r.width/2-tw/2),window.innerWidth-tw-8),y=r.top-th-8;
  if(y<8)y=r.bottom+8;
  tip.style.left=x+'px';tip.style.top=y+'px';
}
function hideTip(){tipFor=null;tip.classList.remove('show');tip.classList.remove('wide');}
document.addEventListener('pointerover',e=>{const el=tipEl(e);if(el&&e.pointerType!=='touch')showTip(el);});
document.addEventListener('pointerout',e=>{const el=tipEl(e);if(el&&!el.contains(e.relatedTarget)&&e.pointerType!=='touch')hideTip();});
document.addEventListener('focusin',e=>{if(e.target.classList&&(e.target.classList.contains('term')||e.target.classList.contains('wyb')))showTip(e.target);});
document.addEventListener('focusout',e=>{if(e.target.classList&&(e.target.classList.contains('term')||e.target.classList.contains('wyb')))hideTip();});
document.addEventListener('click',e=>{const el=tipEl(e);if(el){e.stopPropagation();tipFor===el?hideTip():showTip(el);}else if(tipFor)hideTip();},true);
document.addEventListener('keydown',e=>{if(e.key==='Escape')hideTip();});

let parseCtl=null, aiRequestId=null;
function unwrapTask(out){
  if(out&&Array.isArray(out.tasks)&&out.tasks.length===1&&!out.shots)return out.tasks[0];
  if(out&&out.task&&typeof out.task==='object')return out.task;
  return out;
}
function extractJson(text){
  const t=String(text||'').trim();
  const fenced=t.match(/```(?:json)?\s*([\s\S]*?)```/i);
  return JSON.parse(fenced?fenced[1].trim():t);
}
function acceptBuilt(out,rawText,msg){
  const src=unwrapTask(out)||{};
  const t=normalizeTask(Object.assign({},src,{rawText:src.rawText||rawText||''}));
  $('#createDlg').close();createTask(t);
  toast(msg||(t.missing.length?'Workspace built. Some details need answers.':'Workspace built'));
}
function acceptJson(jsonTxt,rawFallback){
  let out;try{out=extractJson(jsonTxt);}catch(e){$('#parseStatus').textContent='Invalid JSON. Check the text and try again.';return;}
  if(out&&(Array.isArray(out.tasks)||out.shots)){$('#createDlg').close();importPayload(out).catch(err=>toast('Couldn’t import: '+(err.message||'invalid JSON')));return;}
  acceptBuilt(out,rawFallback||'','Workspace built from JSON');
}

function textToPlan(stepsTxt,checksTxt,item){

  const steps=[],checks=[];
  stepsTxt.split('\n').forEach(r=>{const l=r.trim();if(!l)return;const c=lineCheck(l);
    if(c){(steps.length?steps[steps.length-1].checks:checks).push(reuseC(c));return;}

function findRanges(raw,excerpts){
  const ranges=[],missing=[];
  excerpts.forEach(ex=>{
    const e=ex.trim();if(!e)return;
    const i=raw.indexOf(e);
    if(i>=0){ranges.push([i,i+e.length]);return;}
    const words=e.split(/\s+/).filter(Boolean).map(w=>w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'));
    try{const m=new RegExp(words.join('\\s+'),'i').exec(raw);if(m){ranges.push([m.index,m.index+m[0].length]);return;}}catch(_){}
    missing.push(e);
  });
  ranges.sort((a,b)=>a[0]-b[0]);
  const merged=[];ranges.forEach(r=>{const l=merged[merged.length-1];if(l&&r[0]<=l[1])l[1]=Math.max(l[1],r[1]);else merged.push([r[0],r[1]]);});
  return {ranges:merged,missing};
}
function markUp(raw,ranges){let out='',p=0;ranges.forEach(([a,b])=>{out+=esc(raw.slice(p,a))+'<mark>'+esc(raw.slice(a,b))+'</mark>';p=b;});return out+esc(raw.slice(p));}
let srcTask=null;
function excerpts(raw,ranges){
  const spans=[];
  ranges.forEach(([a,b])=>{const s0=raw.lastIndexOf('\n',a-1)+1;let e0=raw.indexOf('\n',b);if(e0<0)e0=raw.length;const l=spans[spans.length-1];if(l&&s0<=l.e+1){l.e=Math.max(l.e,e0);l.r.push([a,b]);}else spans.push({s:s0,e:e0,r:[[a,b]]});});
  return spans.map(sp=>{let out='',p=sp.s;sp.r.forEach(([a,b])=>{out+=esc(raw.slice(p,a))+'<mark>'+esc(raw.slice(a,b))+'</mark>';p=b;});return `<pre class="srctext excerpt">${out+esc(raw.slice(p,sp.e))}</pre>`;}).join('');
}

    if(r.missing.length)html+=`<div class="notice" style="margin:0"><strong>Not found word for word in the original</strong><ul>${r.missing.map(m=>`<li>${esc(m)}</li>`).join('')}</ul></div>`;

async function makeShotDocx(t){
  if(!window.JSZip){toast('The Word tool didn’t load. Reload the app.');return;}
  const has=t.items.some(i=>evidenceUnits(i).length||i.shots.length||recs(i).length);
  if(!has){toast('No evidence to include.');return;}
  toast('Building the evidence file…');
  const zip=new JSZip();const media=zip.folder('word/media');
  const pack=await groupedEvidence(t,media);
  const body=pack.body,rels=pack.rels;
  zip.file('[Content_Types].xml','<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Default Extension="jpeg" ContentType="image/jpeg"/><Default Extension="png" ContentType="image/png"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/></Types>');
  zip.file('_rels/.rels','<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>');
  zip.file('word/_rels/document.xml.rels','<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'+rels+'</Relationships>');
  zip.file('word/document.xml','<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships" xmlns:wp="http://schemas.openxmlformats.org/drawingml/2006/wordprocessingDrawing"><w:body>'+body+'<w:sectPr><w:pgSz w:w="12240" w:h="15840"/><w:pgMar w:top="1080" w:right="1080" w:bottom="1080" w:left="1080" w:header="720" w:footer="720" w:gutter="0"/></w:sectPr></w:body></w:document>');
  const blob=await zip.generateAsync({type:'blob',mimeType:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'});
  save(fileBase(t)+'_evidence.docx',blob);
}

/* ---------- Backup ---------- */
function backupName(){
  const d=new Date();
  const stamp=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  return 'TaskFlow_QA_v1_backup_'+stamp+'.json';
}
$('#exportBtn').addEventListener('click',exportBackup);
async function exportBackup(){
  const out={app:'TaskFlow QA',version:1,exportedAt:new Date().toISOString(),tasks:Object.values(S.tasks),shots:{}};
  for(const t of out.tasks)for(const i of t.items)for(const s of [...i.shots,...units(i).flatMap(u=>u.shots||[])]){const d=await loadShot(t.id,s.id);if(d)out.shots[s.id]={task:t.id,data:d};}
  save(backupName(),JSON.stringify(out,null,2));
}
function tasksFromImport(data){
  if(!data||typeof data!=='object')return [];
  if(Array.isArray(data.tasks))return data.tasks;
  if(data.task&&typeof data.task==='object')return [data.task];
  if(data.items||data.number||data.rawText||data.title)return [data];
  return [];
}
async function importPayload(data){
  const tasks=tasksFromImport(data);
  if(!tasks.length)throw new Error('No tasks in that file');
  let first=null;
  for(const raw of tasks){
    const t=normalizeTask(raw);first=first||t.id;
    for(const i of t.items)for(const s of i.shots){
      const sh=data.shots&&data.shots[s.id];
      if(sh&&sh.data){
        shotCache[s.id]=sh.data;
        if(window.taskflow)await window.taskflow.putShot(t.id,s.id,sh.data);
        else if(db)await db.doc(col+'/'+t.id+'/shots/'+s.id).set({data:sh.data});
        else lsSet('tf.shot.'+s.id,sh.data);
      }
    }
    S.tasks[t.id]=t;persist(t,0);
  }
  setCurrent(first);
  toast(`Imported ${tasks.length} task${tasks.length>1?'s':''}`);
  if(location.hash!=='#implementation')location.hash='#implementation';else render();
}
$('#importBtn').addEventListener('click',()=>importFromPicker());
async function importFromPicker(){
  if(window.taskflow){
    const r=await window.taskflow.openFile({filters:[{name:'JSON',extensions:['json']}]});
    if(!r||r.canceled)return;
    try{await importPayload(JSON.parse(r.text));}catch(err){toast('Couldn’t import: '+(err.message||'invalid JSON'));}
    return;
  }
  $('#importFile').click();
}
$('#importFile').addEventListener('change',async e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  try{await importPayload(JSON.parse(await f.text()));}
  catch(err){toast('Couldn’t import: '+(err.code||err.message));}
});
